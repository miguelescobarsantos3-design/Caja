<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Reset Caja</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      text-align: center;
      background: #f7f7f7;
    }
    .box {
      background: white;
      padding: 25px;
      border-radius: 14px;
      max-width: 420px;
      margin: auto;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
    }
    button {
      background: #111827;
      color: white;
      border: none;
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 16px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Actualizando Caja</h2>
    <p>Esto eliminará el caché viejo y reiniciará la app sin borrar tus datos guardados.</p>
    <button onclick="resetApp()">Actualizar ahora</button>
    <p id="status"></p>
  </div>

  <script>
    async function resetApp() {
      const status = document.getElementById("status");
      status.textContent = "Limpiando caché viejo...";

      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(reg => reg.unregister()));
        }

        if ("caches" in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map(name => caches.delete(name)));
        }

        status.textContent = "Listo. Abriendo versión nueva...";

        setTimeout(() => {
          window.location.href = "./index.html?v=" + Date.now();
        }, 1200);

      } catch (error) {
        status.textContent = "Error limpiando caché. Intenta desde Chrome.";
        console.error(error);
      }
    }

    resetApp();
  </script>
</body>
</html>
