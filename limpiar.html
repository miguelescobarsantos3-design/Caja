<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Limpiar Caja</title>
</head>
<body style="font-family:Arial;padding:30px;">
  <h1>Limpiando Caja...</h1>
  <p id="estado">Espere un momento.</p>

  <script>
    async function limpiar() {
      const estado = document.getElementById("estado");

      try {
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) {
            await reg.unregister();
          }
        }

        if ("caches" in window) {
          const nombres = await caches.keys();
          for (const nombre of nombres) {
            await caches.delete(nombre);
          }
        }

        estado.innerHTML = "Listo. Abriendo Caja nueva...";
        
        setTimeout(() => {
          window.location.href = "index.html?limpio=" + Date.now();
        }, 1500);

      } catch (e) {
        estado.innerHTML = "Error limpiando. Hay que borrar datos del sitio manualmente.";
      }
    }

    limpiar();
  </script>
</body>
</html>
