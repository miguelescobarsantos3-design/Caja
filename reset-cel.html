<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Caja</title>
<style>
body { font-family: sans-serif; padding: 40px 20px; text-align: center; background: #1a3a6b; color: #fff; }
h2 { margin-bottom: 20px; }
.btn { display: block; width: 100%; padding: 18px; margin: 12px 0; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; }
.rojo { background: #dc2626; color: #fff; }
.verde { background: #16a34a; color: #fff; }
#msg { margin-top: 20px; font-size: 14px; opacity: 0.8; }
</style>
</head>
<body>
<h2>🔧 Reset localStorage</h2>
<p>Esto borrará los datos locales del cel para forzar carga desde Firebase</p>

<button class="btn rojo" onclick="resetear()">🗑 Borrar localStorage</button>
<button class="btn verde" onclick="irApp()">→ Ir a la app</button>

<div id="msg"></div>

<script>
function resetear() {
  try {
    localStorage.removeItem('caja_ahorro_2026');
    localStorage.removeItem('caja_ahorro_2026_backup_total');
    localStorage.removeItem('caja_ts');
    localStorage.removeItem('caja_ultimo_guardado_ok');
    document.getElementById('msg').innerHTML = '✓ localStorage borrado. Ahora toca "Ir a la app" y luego "Sync desde nube".';
    document.getElementById('msg').style.color = '#4ecba8';
  } catch(e) {
    document.getElementById('msg').innerHTML = 'Error: ' + e.message;
  }
}

function irApp() {
  window.location.href = 'https://miguelescobarsantos3-design.github.io/Caja/';
}

// Mostrar ts actual
var ts = localStorage.getItem('caja_ts');
document.getElementById('msg').innerHTML = ts ? 'ts actual: ' + ts : 'Sin datos en localStorage';
</script>
</body>
</html>
